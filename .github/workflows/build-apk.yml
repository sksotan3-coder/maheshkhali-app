name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug --stacktrace
      - name: Build signed AAB
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          else
            export KEYSTORE_FILE="$GITHUB_WORKSPACE/signing/upload.jks"
            export KEYSTORE_PASSWORD="9NYIYkOTbuop8Yx4X3mR" KEY_ALIAS="upload" KEY_PASSWORD="9NYIYkOTbuop8Yx4X3mR"
          fi
          gradle bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab AmarMoheshkhali.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AmarMoheshkhali-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AmarMoheshkhali.apk
          gh release delete latest --yes --cleanup-tag || true
          FILES="AmarMoheshkhali.apk"; [ -f AmarMoheshkhali.aab ] && FILES="$FILES AmarMoheshkhali.aab"
          gh release create latest $FILES --title "AmarMoheshkhali APK" --notes "Debug APK built automatically" --target ${{ github.sha }}
