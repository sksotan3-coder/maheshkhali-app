name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/signing/upload.jks
      KEYSTORE_PASSWORD: 9NYIYkOTbuop8Yx4X3mR
      KEY_ALIAS: upload
      KEY_PASSWORD: 9NYIYkOTbuop8Yx4X3mR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleRelease bundleRelease --stacktrace
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AmarMoheshkhali.apk
          cp app/build/outputs/bundle/release/app-release.aab AmarMoheshkhali.aab
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AmarMoheshkhali.apk AmarMoheshkhali.aab --title "AmarMoheshkhali APK and AAB" --notes "Signed release APK and AAB built automatically" --target ${{ github.sha }}
